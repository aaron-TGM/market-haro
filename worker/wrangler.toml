# Market Haro at marketharo.io.
#
# DEPLOYED THROUGH THE CLOUDFLARE DASHBOARD (Sep 2026): the code is pasted into
# Workers & Pages -> market-haro -> Edit code, and the vars, secret, KV binding
# and custom domain below are set there. This file mirrors that configuration
# for reference and for `wrangler dev`. Do not `wrangler deploy` -- it would
# replace the dashboard's settings with this file's.
#
# One Worker, one page. It serves the report the pipeline pushes each morning
# to signed-in GUNDECK users whose account carries a Market Haro subscription,
# the splash page to everyone else, the public track record, and each user's
# watchlist so it follows them across devices. Identity is Clerk's -- the same
# instance gundeck.ai signs people in with; marketharo.io is registered there
# as a satellite domain of gundeck.ai -- verified here against its published
# keys. Billing is Stripe's, on gundeck.ai; its webhook writes the
# entitlement onto the Clerk user and this Worker only reads it.
#
# Secret (set with `npx wrangler secret put ADMIN_SECRET`): shared with the
# pipeline, which pushes the pages with it. Nothing else is secret.

name = "market-haro"
main = "src/index.js"
compatibility_date = "2026-06-01"

# The custom domain: the marketharo.io zone lives in Cloudflare (nameservers
# pointed there from Namecheap); wrangler attaches the apex as a custom domain.
# www is a redirect rule in the dashboard, not a route here.
routes = [{ pattern = "marketharo.io", custom_domain = true }]

[vars]
# Clerk. The issuer(s) tokens may carry -- the primary Frontend API host, and
# the satellite's once Clerk assigns one (comma-separated; the first is where
# the keys are fetched from). The publishable key is public.
CLERK_ISSUER = "https://clerk.gundeck.ai,https://clerk.marketharo.io"
CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsuZ3VuZGVjay5haSQ"
# This domain is a Clerk *satellite* of gundeck.ai (Clerk dashboard -> Domains
# -> Add satellite domain -> marketharo.io, plus the CNAME it asks for). Sign-in
# and sign-up happen on gundeck.ai's pages and return here.
CLERK_SATELLITE_DOMAIN = "marketharo.io"
SIGN_IN_URL = "https://gundeck.ai/sign-in"
SIGN_UP_URL = "https://gundeck.ai/sign-up"
# The one gundeck.ai route that starts a subscription for the signed-in user
# (?plan=monthly|annual -> Stripe Checkout -> back here with ?checkout=success),
# and the account page where it is managed. Sign-up and sign-in happen on the
# splash itself, in Clerk's modal.
CHECKOUT_URL = "https://gundeck.ai/market-haro/subscribe"
MANAGE_URL = "https://gundeck.ai/account"
# Where the one-time cross-sell banner after checkout sends people (GUNDECK is
# a separate subscription on the same account).
GUNDECK_URL = "https://gundeck.ai/pricing"
# The entitlement, as Stripe's webhook writes it onto the Clerk user and
# Clerk's session-token template copies it into the token. Defaults look at
# public_metadata.marketHaro.status (or market_haro) for active|trialing.
# Override the path or the values here if the webhook writes a different
# shape; set ENTITLEMENT_PLAN to a plan slug instead if Clerk Billing is used.
ENTITLEMENT_PATH = ""
ENTITLEMENT_VALUES = "active,trialing"
ENTITLEMENT_PLAN = ""

[[kv_namespaces]]
binding = "HARO"
id = "replace-with-your-kv-namespace-id"
