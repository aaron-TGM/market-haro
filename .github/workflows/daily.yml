# Daily run: rebuild the database from the archive, sync today's prices, render
# the dashboard, commit the archive back, push the page to the site Worker.
#
# WHY IT RESTORES FIRST
# The SQLite database is NOT in the repo. Committing a binary that git rewrites
# whole every day would grow the pack file into gigabytes (see radar/archive.py).
# The durable artifact is data/history/*.ndjson, and the database is rebuilt from
# it at the start of every run. The runner stays stateless, the history stays
# plain text, and a failed run costs you one day rather than everything.
#
# WHAT IT NEEDS
#   secrets.TCGAPI_KEY             your tcgapi.dev key                  required
#   secrets.HARO_ADMIN_SECRET      the site Worker's admin secret       optional
#
# With the secret set, every run pushes the report and the track record to
# marketharo.io. Without it the report is still built and kept as a
# workflow artifact; nothing fails, the publish step is skipped.
#
# THE PROMISE TO SUBSCRIBERS
# The page is refreshed every day the workflow runs, including days the price
# feed is late or partial; the page says how old its prices are. What must NOT
# happen is a silent skip, so the publish step runs even when sync reported a
# problem.

name: daily

on:
  schedule:
    # 13:10 UTC. TCGplayer's batch lands overnight US time, so this reads a
    # settled feed rather than one mid-update. Minute 10 rather than 00 because
    # GitHub queues everything scheduled on the hour and runs it late anyway.
    - cron: "10 13 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Also backfill 90-day history for cards that lack it"
        type: boolean
        default: false

# Two runs writing the archive at once would race on the commit.
concurrency:
  group: radar-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TCGAPI_KEY: ${{ secrets.TCGAPI_KEY }}
      # Hoisted so the publish steps can test them -- `secrets` is not available
      # in a step-level `if`, but `env` is.
      HARO_ADMIN_SECRET: ${{ secrets.HARO_ADMIN_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      # Card art is embedded in the report. The cache keeps the ~200 fetched
      # images between runs so a daily build touches the image CDN only for
      # cards it has not seen before.
      - uses: actions/cache@v4
        with:
          path: data/images
          key: card-art-${{ github.run_id }}
          restore-keys: card-art-

      - name: Rebuild the database from the archive
        run: python -m radar restore

      - name: Sync today's prices
        # continue-on-error: a late or partial feed must not stop the issue.
        # invest builds on what is stored, and the digest says how old it is.
        continue-on-error: true
        run: python -m radar sync --no-history

      - name: Backfill history
        if: inputs.backfill
        run: python -m radar backfill --range quarter

      - name: Build the hold screen
        run: python -m radar invest --out out/index.html

      - name: Keep today's build as a run artifact (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: issue-${{ github.run_id }}
          path: out/
          retention-days: 7
      - name: Write the archive
        run: python -m radar export

      - name: Test
        # After the archive is written, before it is committed -- a broken run
        # must not push a corrupted history.
        run: python tests/test_pipeline.py

      - name: Monthly validation
        # Has the score stopped separating winners from losers? Once a month is
        # enough; what matters is the drift between runs, not any single rho.
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            python -m radar validate | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Not the 1st -- skipping validation." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit the archive
        run: |
          git config user.name  "radar[bot]"
          git config user.email "radar[bot]@users.noreply.github.com"
          git add data/history data/cards.ndjson data/sets.ndjson data/rankings data/validation_history.json
          if git diff --staged --quiet; then
            echo "Nothing new today."
          else
            git commit -m "history: $(date -u +%Y-%m-%d)"
            # Another run may have landed while this one was working.
            git pull --rebase --autostash
            git push
          fi

      - name: Push the page to marketharo.io
        if: env.HARO_ADMIN_SECRET != ''
        run: python -m radar publish
